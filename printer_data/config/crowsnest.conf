[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose
delete_log: false
no_proxy: false

[cam Top]
mode: ustreamer
port: 8080
device: /dev/v4l/by-id/usb-HD_WebCam_C270_HD_WebCam_C270_SN0001-video-index0
resolution: 1280x960
max_fps: 30
custom_flags: --rotate 270 v4l2ctl: focus_auto=0,focus_absolute=30

