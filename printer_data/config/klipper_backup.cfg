[gcode_shell_command klipper_backup]
command: /bin/bash /home/pi/klipper-backup/script.sh
timeout: 300.
verbose: True

[gcode_macro BACKUP]
description: Voron Konfiguration auf GitHub sichern
gcode:
    RESPOND MSG="Klipper-Backup wird gestartet..."
    RUN_SHELL_COMMAND CMD=klipper_backup
    RESPOND MSG="Klipper-Backup Befehl beendet. GitHub-Ergebnis im Konsolenprotokoll pruefen."
