# ============================================================
# VORON 2.4 - ELEKTRONIKKUEHLUNG
# BTT Octopus / TMC2209
# ============================================================

[controller_fan controller_fan]
pin: PD12
max_power: 1.0
kick_start_time: 0.5
shutdown_speed: 0.0

fan_speed: 1.0
idle_speed: 1.0
idle_timeout: 60

stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3
heater: heater_bed


# Raspberry Pi CPU-Temperaturgesteuerter Luefter
[temperature_fan Raspberry_Cooling]
pin: PA8
max_power: 1.0
kick_start_time: 0.5
shutdown_speed: 1.0

sensor_type: temperature_host
control: watermark
target_temp: 50
max_delta: 5

min_temp: 10
max_temp: 100

# ============================================================
# VORON 2.4 - AKTIVKOHLEFILTER
# Einschalten: Bettsolltemperatur >= 100 C
# Ausschalten: Betttemperatur < 50 C
# ============================================================

[fan_generic BedFan]
pin: PD14
max_power: 1.0
kick_start_time: 0.5
shutdown_speed: 0


[gcode_macro _BED_FILTER_STATE]
variable_active: 0
gcode:


[delayed_gcode BED_FILTER_CONTROL]
initial_duration: 5
gcode:
    {% set bed_target = printer.heater_bed.target|float %}
    {% set bed_actual = printer.heater_bed.temperature|float %}
    {% set active = printer["gcode_macro _BED_FILTER_STATE"].active|int %}

    # Einschalten bei ABS/ASA-Betttemperatur
    {% if bed_target >= 100 %}

        {% if active == 0 %}
            SET_FAN_SPEED FAN=BedFan SPEED=1.0
            SET_GCODE_VARIABLE MACRO=_BED_FILTER_STATE VARIABLE=active VALUE=1
        {% endif %}

    # Nachlauf bis Bett unter 50 Grad
    {% elif active == 1 and bed_actual < 50 %}

        SET_FAN_SPEED FAN=BedFan SPEED=0
        SET_GCODE_VARIABLE MACRO=_BED_FILTER_STATE VARIABLE=active VALUE=0

    {% endif %}

    UPDATE_DELAYED_GCODE ID=BED_FILTER_CONTROL DURATION=5


