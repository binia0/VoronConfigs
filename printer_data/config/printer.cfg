# ------------------------------------------------------------------------------
# Example 1: QUAD_GANTRY_LEVEL Integration
# ------------------------------------------------------------------------------
# Shows how to wrap your existing QGL macro with KNOMI status flags

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BASE_QUAD_GANTRY_LEVEL
description: QGL with KNOMI display integration
gcode:
    # Set qgling flag to show QGL animation on display
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True

    # Your QGL logic here
    {% if printer.quad_gantry_level.applied == False %}
        BASE_QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10 RETRY_TOLERANCE=0.015
        # Optional: Add fine calibration stage
        # FINE_QUAD_GANTRY_LEVEL
    {% else %}
        BASE_QUAD_GANTRY_LEVEL
    {% endif %}

    # Clear qgling flag when done
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
    

# ------------------------------------------------------------------------------
# PRINT_START - StealthChanger T0-T5 with LED status
# ------------------------------------------------------------------------------

[gcode_macro PRINT_START]
gcode:
  {% set TOOL = params.TOOL|default(0)|int %}
  {% set TOOL_TEMP = params.TOOL_TEMP|default(params.EXTRUDER|default(0))|float %}
  {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(0))|float %}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}

  ; Heating bed - Orange
  TOOLHEAD_LED_HEATING
  M117 Heating Bed
  M190 S{BED_TEMP}

  ; Homing - Blue
  TOOLHEAD_LED_HOMING
  M117 Homing
  G28

  ; Reference tool for calibration
  T0

  ; Quad Gantry Level - Purple
  TOOLHEAD_LED_QGL
  M117 Quad Gantry Level
  QUAD_GANTRY_LEVEL

  ; Z Homing - Blue
  TOOLHEAD_LED_HOMING
  M117 Z Homing
  G28 Z

  ; Adaptive Bed Mesh - Cyan
  TOOLHEAD_LED_MESH
  M117 Bed Mesh
  BED_MESH_CALIBRATE ADAPTIVE=1

  ; Select the first printing tool
  {% if TOOL != 0 %}
    M104 T0 S0
    TOOLHEAD_LED_TOOLCHANGE
    T{TOOL}
  {% endif %}

  ; Heat selected tool and wait before extrusion - Orange
  TOOLHEAD_LED_HEATING
  M117 Heating T{TOOL}
  SET_TOOL_TEMPERATURE T={TOOL} TARGET={TOOL_TEMP} WAIT=1

  ; Prime nozzle - Yellow
  TOOLHEAD_LED_PRIME
  M117 Prime Line
  NOZZLE_PRIME_LINE

  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    START_CRASH_DETECTION
  {% endif %}

  ; Printing - White
  TOOLHEAD_LED_PRINTING
  M117 Printing


# ------------------------------------------------------------------------------
# PRINT_END - StealthChanger T0-T5
# ------------------------------------------------------------------------------

[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
  {% set active_tool = printer.toolchanger.tool_number|int %}

  M400

  M220 S100
  M221 S100

  SET_PRESSURE_ADVANCE ADVANCE=0

  ; Retract only if the active extruder is hot enough
  {% if active_tool >= 0 %}
    {% set extruder = "extruder" ~ (active_tool if active_tool > 0 else "") %}
    {% if printer[extruder].can_extrude %}
      M83
      G1 E-5.0 F3600
    {% endif %}
  {% endif %}

  ; Lift away from printed object
  G90
  G0 Z{z_safe} F3000
  G0 X{x_safe} Y{y_safe} F12000

  ; Return to reference tool T0
  T0

  ; Park
  G90
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

  ; Shutdown all six tools
  {% for tn in printer.toolchanger.tool_numbers %}
    M104 S0 T{tn}
    M107 T{tn}
    SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0
  {% endfor %}

  M140 S0

  ; Print finished - Green
  TOOLHEAD_LED_DONE
  M117 Print Complete


# ------------------------------------------------------------------------------
# PAUSE - Toolchanger-Aware
# ------------------------------------------------------------------------------

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Toolchanger-aware pause
gcode:
    {% set tc = printer.toolchanger if "toolchanger" in printer else {} %}
    {% set in_tc_error = (tc.status|default("") == "error") %}

    {% set tool_lost = False %}
    {% if tc.tool_number is defined and tc.tool_number >= 0 %}
        {% set tool_name = "tool T" ~ tc.tool_number %}
        {% set tool_obj = printer[tool_name] if tool_name in printer else None %}
        {% if tool_obj and tool_obj.detect_state != 1 %}
            {% set tool_lost = True %}
        {% endif %}
    {% endif %}

    PAUSE_BASE

    {% if in_tc_error or tool_lost %}
        TOOLHEAD_LED_ERROR

        {% if tool_lost %}
            M117 Tool lost - Paused (DO NOT MOVE!)
        {% else %}
            M117 TC Error - Paused at dock
        {% endif %}
    {% else %}
        _TOOLHEAD_PARK_PAUSE_CANCEL {rawparams}
    {% endif %}


# ------------------------------------------------------------------------------
# RESUME - Toolchanger-Aware
# ------------------------------------------------------------------------------

[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume
gcode:
    {% if printer["gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL"].restore_idle_timeout > 0 %}
        SET_IDLE_TIMEOUT TIMEOUT={printer["gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL"].restore_idle_timeout}
    {% endif %}

    RESUME_BASE {rawparams}

    TOOLHEAD_LED_PRINTING


# ------------------------------------------------------------------------------
# CANCEL_PRINT - StealthChanger
# ------------------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel print
gcode:
    M400
    G92 E0
    G1 E-2.0 F3600

    M104 S0
    M140 S0

    ; Print cancelled - Red
    TOOLHEAD_LED_ERROR

    CANCEL_PRINT_BASE

    M117 Print cancelled


