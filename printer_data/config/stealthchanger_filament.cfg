# StealthChanger 6-Tool Filament-Helfer (T0-T5)
# Fuer vorhandene KTC-Easy Tools, LDO Nitehawk-36 und zwei bestehende
# Filament-Switch-Sensoren je Werkzeug (Tn_entry / Tn_runout).
# Diese Datei DEFINIERT KEINE Pins, Extruder, Tools, PAUSE/RESUME oder T0-T5 neu.
# In printer.cfg genau einmal einbinden:
# [include stealthchanger_filament.cfg]
#
# Konsolenbefehle:
#   LOAD / LOAD_FILAMENT / UNLOAD / UNLOAD_FILAMENT
#   SC_FILAMENT_STATUS                 -> Tool und alle 12 Sensoren anzeigen
#   SC_LOAD_FILAMENT TEMP=210          -> nur aktuell angekoppeltes Werkzeug laden
#   SC_UNLOAD_FILAMENT TEMP=210 EXTRA=8 -> Sensorbasiert entladen (bis entry=False + 8 mm)
#   SC_UNLOAD_STOP                   -> weitere Entladeschritte verhindern
#
# Vor Benutzung: Mechanische Filamentwege / Temperaturen pro Material pruefen.
# Entry-Sensor loest SC_ENTRY_EVENT aus; Watchdog sichert verpasste Events ab.
# print_stats.state=paused kann als alter Dateistatus bestehen bleiben;
# nur state=printing oder echte pause_resume.is_paused blockieren LOAD/UNLOAD.
# Nur aktuell angekoppeltes Werkzeug, kein Druck. Die beiden Sensoren je Tool
# erhalten hier Override-Optionen ohne Aenderung ihrer Pins.
# Entladetaste NICHT implementiert: kein bestaetigter Button-Eingang.
# Entladen bis entry=False mit einstellbarem Nachlauf (mm, nicht Motorumdrehungen).
# pause_on_runout wird unten fuer alle Sensoren zentral deaktiviert.
# Aktives Runout waehrend eines Druckes wird zentral behandelt.

[gcode_macro _SC_FILAMENT_SETTINGS]
variable_load_grip: 10.0
variable_load_main: 35.0
variable_load_prime: 15.0
variable_load_purge: 10.0
variable_unload_push: 5.0
variable_unload_fast: 15.0
variable_unload_slow: 80.0
# Sensorbasiertes Entladen: 2 mm pro Schritt, hoechstens 130 mm vor Sensorfreigabe.
variable_unload_step: 2.0
variable_unload_max_search: 130.0
# Nachlauf nach entry=False (mm Filamentweg; auf zwei reale Umdrehungen kalibrieren).
variable_unload_after_entry: 8.0
variable_default_temp: 210.0
variable_min_requested_temp: 170.0
variable_max_requested_temp: 290.0
gcode:
  RESPOND TYPE=echo MSG="SC filament settings loaded"

[gcode_macro SC_FILAMENT_STATUS]
description: Anzeige der Tool- und Filamentsensorzustaende T0-T5
gcode:
  {% set tc = printer.toolchanger %}
  {% set n = tc.tool_number|int %}
  {action_respond_info("StealthChanger status=%s tool_number=%s active_extruder=%s" % (tc.status, n, printer.toolhead.extruder))}
  {% for i in range(6) %}
    {% set entry = printer['filament_switch_sensor T' ~ i ~ '_entry'] %}
    {% set runout = printer['filament_switch_sensor T' ~ i ~ '_runout'] %}
    {action_respond_info("T%d entry=%s (enabled=%s) runout=%s (enabled=%s)" % (i, entry.filament_detected, entry.enabled, runout.filament_detected, runout.enabled))}
  {% endfor %}

[gcode_macro SC_LOAD_FILAMENT]
description: Filament am angekoppelten Tool sicher manuell laden; TEMP optional
gcode:
  {% set tc = printer.toolchanger %}
  {% set n = tc.tool_number|int %}
  {% set expected = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% set active = printer.toolhead.extruder %}
  {% set s = printer['gcode_macro _SC_FILAMENT_SETTINGS'] %}
  {% set temp = params.TEMP|default(s.default_temp)|float %}
  {% if printer['gcode_macro _SC_UNLOAD_CONTROL'].busy|int == 1 %}
    {action_raise_error('SC_LOAD_FILAMENT: Entladen laeuft')}
  {% elif printer.print_stats.state == 'printing' or printer.pause_resume.is_paused %}
    {action_raise_error('SC_LOAD_FILAMENT: Nicht waehrend eines Drucks/Pause')}
  {% elif n < 0 or n > 5 or tc.tool is none or tc.status != 'ready' %}
    {action_raise_error('SC_LOAD_FILAMENT: Kein Werkzeug angekoppelt/bereit')}
  {% elif not printer['filament_switch_sensor T' ~ n ~ '_entry'].filament_detected %}
    {action_raise_error('SC_LOAD_FILAMENT: Kein Filament am Entry-Sensor')}
  {% elif active != expected %}
    {action_raise_error('SC_LOAD_FILAMENT: Aktiver Extruder %s passt nicht zu T%d (%s)' % (active, n, expected))}
  {% elif temp < s.min_requested_temp or temp > s.max_requested_temp or temp >= printer.configfile.settings[expected].max_temp|float %}
    {action_raise_error('SC_LOAD_FILAMENT: TEMP ausserhalb des erlaubten Bereichs')}
  {% else %}
    SAVE_GCODE_STATE NAME=SC_LOAD_STATE
    SET_HEATER_TEMPERATURE HEATER={expected} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={expected} MINIMUM={temp - 1}
    M83
    G1 E{s.load_grip} F300
    G1 E{s.load_main} F600
    G1 E{s.load_prime} F300
    G1 E{s.load_purge} F200
    M400
    RESTORE_GCODE_STATE NAME=SC_LOAD_STATE
    RESPOND TYPE=echo MSG="SC: Filament in T{n} geladen"
  {% endif %}

# Zustand fuer schrittweises, sensorbasiertes Entladen.
[gcode_macro _SC_UNLOAD_CONTROL]
variable_busy: 0
variable_tool: -1
variable_moved: 0.0
variable_extra: 8.0
variable_step: 2.0
variable_max_search: 130.0
gcode:
  RESPOND TYPE=echo MSG="SC Unload Controller bereit"

[gcode_macro SC_UNLOAD_FILAMENT]
description: Aktives Tool entladen bis Entry-Sensor frei plus einstellbarer Nachlauf
gcode:
  {% set tc = printer.toolchanger %}
  {% set n = tc.tool_number|int %}
  {% set expected = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% set s = printer['gcode_macro _SC_FILAMENT_SETTINGS'] %}
  {% set ctl = printer['gcode_macro _SC_UNLOAD_CONTROL'] %}
  {% set temp = params.TEMP|default(s.default_temp)|float %}
  {% set after = params.EXTRA|default(s.unload_after_entry)|float %}
  {% set step = s.unload_step|float %}
  {% set maximum = s.unload_max_search|float %}
  {% if ctl.busy|int == 1 %}
    {action_raise_error('SC_UNLOAD: Es laeuft bereits ein Entladen')}
  {% elif printer.print_stats.state == 'printing' or printer.pause_resume.is_paused %}
    {action_raise_error('SC_UNLOAD: Nicht bei Druck oder Pause entladen')}
  {% elif n < 0 or n > 5 or tc.tool is none or tc.status != 'ready' %}
    {action_raise_error('SC_UNLOAD: KTC-Easy hat kein sicher angekoppeltes Werkzeug')}
  {% elif printer.toolhead.extruder != expected %}
    {action_raise_error('SC_UNLOAD: Aktiver Extruder stimmt nicht mit T%d ueberein' % n)}
  {% elif not printer['filament_switch_sensor T' ~ n ~ '_entry'].filament_detected %}
    {action_raise_error('SC_UNLOAD: Entry-Sensor ist bereits FALSE - kein definiertes Sensor-Ende')}
  {% elif not printer['filament_switch_sensor T' ~ n ~ '_entry'].enabled %}
    {action_raise_error('SC_UNLOAD: Entry-Sensor ist deaktiviert')}
  {% elif temp < s.min_requested_temp or temp > s.max_requested_temp or temp >= printer.configfile.settings[expected].max_temp|float %}
    {action_raise_error('SC_UNLOAD: Ungueltige Temperatur')}
  {% elif after < 0 or after > 30 or step <= 0 or step > 5 or maximum < 20 or maximum > 250 %}
    {action_raise_error('SC_UNLOAD: Unzulaessiger Nachlauf oder Suchweg')}
  {% else %}
    RESPOND TYPE=echo MSG="SC: T{n} auf {temp} C aufheizen, sensorbasiertes Entladen"
    SET_HEATER_TEMPERATURE HEATER={expected} TARGET={temp}
    TEMPERATURE_WAIT SENSOR={expected} MINIMUM={temp - 1}
    _SC_UNLOAD_BEGIN TOOL={n} EXTRA={after} STEP={step} MAX={maximum}
  {% endif %}

[gcode_macro _SC_UNLOAD_BEGIN]
gcode:
  {% set n = params.TOOL|int %}
  {% set ex = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% if printer.toolchanger.tool_number|int != n or printer.toolhead.extruder != ex or not printer[ex].can_extrude or not printer['filament_switch_sensor T' ~ n ~ '_entry'].filament_detected %}
    {action_raise_error('SC_UNLOAD: Nach dem Aufheizen ist Werkzeug/Sensor/Temperatur ungueltig')}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=tool VALUE={n}
    SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=moved VALUE=0.0
    SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=extra VALUE={params.EXTRA|float}
    SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=step VALUE={params.STEP|float}
    SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=max_search VALUE={params.MAX|float}
    SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=busy VALUE=1
    SAVE_GCODE_STATE NAME=SC_SENSOR_UNLOAD_STATE
    M83
    G1 E5 F200
    G1 E-15 F1800
    M400
    RESTORE_GCODE_STATE NAME=SC_SENSOR_UNLOAD_STATE
    UPDATE_DELAYED_GCODE ID=_SC_UNLOAD_TICK DURATION=0.1
  {% endif %}

[delayed_gcode _SC_UNLOAD_TICK]
gcode:
  {% set ctl = printer['gcode_macro _SC_UNLOAD_CONTROL'] %}
  {% set n = ctl.tool|int %}
  {% set ex = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% if ctl.busy|int == 1 %}
    {% if n < 0 or n > 5 or printer.toolchanger.tool_number|int != n or printer.toolchanger.tool is none or printer.toolchanger.status != 'ready' or printer.toolhead.extruder != ex or printer.print_stats.state == 'printing' or printer.pause_resume.is_paused or not printer[ex].can_extrude %}
      SC_UNLOAD_STOP REASON=Safety_stop
    {% elif not printer['filament_switch_sensor T' ~ n ~ '_entry'].enabled %}
      SC_UNLOAD_STOP REASON=Sensor_disabled
    {% elif not printer['filament_switch_sensor T' ~ n ~ '_entry'].filament_detected %}
      # Freigabe erkannt: nur noch definierter Nachlauf.
      SC_UNLOAD_STOP REASON=Sensor_released
      _SC_UNLOAD_FINISH_EXTRA TOOL={n} EXTRA={ctl.extra}
    {% elif ctl.moved|float >= ctl.max_search|float %}
      SC_UNLOAD_STOP REASON=MAX_DISTANCE_SENSOR_STILL_TRUE
    {% else %}
      SAVE_GCODE_STATE NAME=SC_SENSOR_UNLOAD_TICK_STATE
      M83
      G1 E-{ctl.step} F600
      M400
      RESTORE_GCODE_STATE NAME=SC_SENSOR_UNLOAD_TICK_STATE
      SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=moved VALUE={ctl.moved|float + ctl.step|float}
      UPDATE_DELAYED_GCODE ID=_SC_UNLOAD_TICK DURATION=0.1
    {% endif %}
  {% endif %}

[gcode_macro _SC_UNLOAD_FINISH_EXTRA]
gcode:
  {% set n = params.TOOL|int %}
  {% set extra = params.EXTRA|float %}
  {% set ex = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% if printer.toolchanger.tool_number|int == n and printer.toolhead.extruder == ex and printer[ex].can_extrude and printer.print_stats.state != 'printing' and not printer.pause_resume.is_paused %}
    {% if extra > 0 %}
      SAVE_GCODE_STATE NAME=SC_SENSOR_UNLOAD_EXTRA_STATE
      M83
      G1 E-{extra} F600
      M400
      RESTORE_GCODE_STATE NAME=SC_SENSOR_UNLOAD_EXTRA_STATE
    {% endif %}
    RESPOND TYPE=echo MSG="SC: T{n} Entry frei, {extra} mm Nachlauf abgeschlossen"
  {% else %}
    RESPOND TYPE=error MSG="SC: Nachlauf abgebrochen - Werkzeug oder Temperatur ungueltig"
  {% endif %}

[gcode_macro SC_UNLOAD_STOP]
description: Sensorbasiertes Entladen sofort beenden
gcode:
  {% set reason = params.REASON|default('User_stop') %}
  UPDATE_DELAYED_GCODE ID=_SC_UNLOAD_TICK DURATION=0
  SET_GCODE_VARIABLE MACRO=_SC_UNLOAD_CONTROL VARIABLE=busy VALUE=0
  RESPOND TYPE=echo MSG="SC: Entladen beendet: {reason}"

# ============================================================================
# AUTOMATISCHER EINZUG: direkter Sensor-Callback und Polling-Fallback.
# Die Sensorsektionen unten UEBERSCHREIBEN NUR die angegebenen Optionen.
# Die bereits in tools/Tn.cfg eingestellten switch_pin bleiben erhalten.
# Diese CFG MUSS NACH toolchanger-include.cfg eingebunden sein!
# ============================================================================
[gcode_macro _SC_AUTOLOAD]
variable_enabled: True
variable_busy: 0
# Erkennung: 6 Zeichen fuer T0-T5. Nach Restart erst Sensorzustand lernen.
variable_seen: "------"
variable_latched: "000000"
gcode:
  RESPOND TYPE=echo MSG="SC Autoload bereit"

[gcode_macro SC_AUTOLOAD_ON]
gcode:
  SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=enabled VALUE=True
  RESPOND TYPE=echo MSG="SC Autoload ON"

[gcode_macro SC_AUTOLOAD_OFF]
gcode:
  SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=enabled VALUE=False
  RESPOND TYPE=echo MSG="SC Autoload OFF"

[gcode_macro SC_AUTOLOAD_DEBUG]
gcode:
  {% set a = printer['gcode_macro _SC_AUTOLOAD'] %}
  {% set tc = printer.toolchanger %}
  {action_respond_info('enabled=%s busy=%s seen=%s latched=%s tool=%s status=%s extruder=%s print=%s' % (a.enabled, a.busy, a.seen, a.latched, tc.tool_number, tc.status, printer.toolhead.extruder, printer.print_stats.state))}

[gcode_macro SC_ENTRY_EVENT]
description: Entry Ereignis fuer T0-T5, mit Sperre gegen Doppel-Laden
gcode:
  {% set n = params.TOOL|int %}
  {% set tc = printer.toolchanger %}
  {% set auto = printer['gcode_macro _SC_AUTOLOAD'] %}
  {% set ex = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% if n < 0 or n > 5 %}
    RESPOND TYPE=error MSG="SC: ungueltiger Toolindex"
  {% elif not auto.enabled %}
    RESPOND TYPE=echo MSG="SC T{n}: Autoload ausgeschaltet"
  {% elif auto.busy|int == 1 %}
    RESPOND TYPE=echo MSG="SC T{n}: anderer Ladeversuch aktiv"
  {% elif auto.latched|length == 6 and auto.latched[n] == '1' %}
    RESPOND TYPE=echo MSG="SC T{n}: Ladeversuch bereits gestartet"
  {% elif tc.tool_number|int != n or tc.tool is none or tc.status != 'ready' or printer.toolhead.extruder != ex %}
    RESPOND TYPE=echo MSG="SC T{n}: nicht angekoppelt/bereit"
  {% elif printer.print_stats.state == 'printing' or printer.pause_resume.is_paused %}
    RESPOND TYPE=echo MSG="SC T{n}: Druck aktiv - Autoload blockiert"
  {% elif not printer['filament_switch_sensor T' ~ n ~ '_entry'].filament_detected %}
    RESPOND TYPE=echo MSG="SC T{n}: Entry schon wieder frei"
  {% else %}
    # Sperre vor Heizen setzen; erst bei Entry=False wieder freigeben.
    {% set new_latched = auto.latched[:n] ~ '1' ~ auto.latched[n+1:] %}
    SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=latched VALUE='"{new_latched}"'
    SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=busy VALUE=1
    RESPOND TYPE=echo MSG="SC T{n}: ENTRY erkannt, starte Heizen und LOAD"
    _SC_AUTOLOAD_EXEC TOOL={n}
  {% endif %}

# Zweiter Erkennungspfad: faengt verpasste insert_gcode-Ereignisse ab.
# Merkt sich den Sensorwechsel, wird nach Neustart initialisiert (ohne Einzug).
[delayed_gcode _SC_ENTRY_WATCH]
initial_duration: 2.0
gcode:
  {% set a = printer['gcode_macro _SC_AUTOLOAD'] %}
  {% set ns = namespace(now='', first=-1) %}
  {% for i in range(6) %}
    {% set b = '1' if printer['filament_switch_sensor T' ~ i ~ '_entry'].filament_detected else '0' %}
    {% set ns.now = ns.now ~ b %}
    {% if a.seen|length == 6 and a.seen[i] == '0' and b == '1' %}
      {% set ns.first = i %}
    {% endif %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=seen VALUE='"{ns.now}"'
  # Bei entfernten Filamenten die Sperren zuruecksetzen.
  {% set ns2 = namespace(latch='') %}
  {% for i in range(6) %}
    {% set ns2.latch = ns2.latch ~ ('0' if ns.now[i] == '0' else a.latched[i]) %}
  {% endfor %}
  {% if ns2.latch != a.latched %}
    SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=latched VALUE='"{ns2.latch}"'
  {% endif %}
  {% if ns.first >= 0 and a.enabled and a.busy|int == 0 and a.latched[ns.first] != '1' %}
    RESPOND TYPE=echo MSG="SC T{ns.first}: Sensorwechsel ueber Watchdog erkannt"
    SC_ENTRY_EVENT TOOL={ns.first}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_SC_ENTRY_WATCH DURATION=0.4

[gcode_macro _SC_AUTOLOAD_EXEC]
gcode:
  {% set n = params.TOOL|int %}
  {% set tc = printer.toolchanger %}
  {% set ex = 'extruder' if n == 0 else 'extruder' ~ n %}
  {% if tc.tool_number|int == n and tc.tool is not none and tc.status == 'ready' and printer.toolhead.extruder == ex and printer['filament_switch_sensor T' ~ n ~ '_entry'].filament_detected and printer.print_stats.state != 'printing' and not printer.pause_resume.is_paused %}
    SC_LOAD_FILAMENT TEMP={printer['gcode_macro _SC_FILAMENT_SETTINGS'].default_temp}
  {% else %}
    RESPOND TYPE=error MSG="SC: Autoload abgebrochen - Tool/Sensor nicht bereit"
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_SC_AUTOLOAD VARIABLE=busy VALUE=0

[gcode_macro SC_RUNOUT_EVENT]
description: Runout nur am aktiven Werkzeug waehrend des Drucks
gcode:
  {% set n = params.TOOL|int %}
  {% set tc = printer.toolchanger %}
  {% if tc.tool_number|int == n and tc.tool is not none and tc.status == 'ready' and printer.print_stats.state == 'printing' and not printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="SC: Filamentende an T{n} erkannt"
    PAUSE
  {% endif %}

# SENSOR-OVERRIDES: Original-Pins, LED-Definitionen und Tool-Makros bleiben
# in den T0-T5.cfg bestehen. Die letzte Definition dieser Optionen gewinnt.
# entry pause_on_runout=False verhindert Pausen beim Entladen.
# runout pause_on_runout=False verhindert Pausen durch geparkte Toolheads.
# Das aktive Werkzeug bekommt weiterhin SC_RUNOUT_EVENT im Druck.

[filament_switch_sensor T0_entry]
pause_on_runout: False
insert_gcode:
  SC_ENTRY_EVENT TOOL=0
runout_gcode:
  RESPOND TYPE=echo MSG="SC T0: Entry frei"

[filament_switch_sensor T0_runout]
pause_on_runout: False
runout_gcode:
  SC_RUNOUT_EVENT TOOL=0
insert_gcode:
  RESPOND TYPE=echo MSG="SC T0: Runout Sensor Filament erkannt"

