# ============================================================================
# OEFFENTLICHE BEFEHLE: ALLES IN DIESER EINEN DATEI
# loading.cfg darf nicht mehr eingebunden sein, bevor Klipper neu startet.
# ============================================================================
[gcode_macro LOAD]
description: Aktuell angedocktes Werkzeug laden
gcode:
  SC_LOAD_FILAMENT {rawparams}

[gcode_macro UNLOAD]
description: Aktuell angedocktes Werkzeug bis Entry frei plus Nachlauf entladen
gcode:
  SC_UNLOAD_FILAMENT {rawparams}

[gcode_macro LOAD_FILAMENT]
description: Alternative Schreibweise zu LOAD
gcode:
  LOAD {rawparams}

[gcode_macro UNLOAD_FILAMENT]
description: Alternative Schreibweise zu UNLOAD
gcode:
  UNLOAD {rawparams}
