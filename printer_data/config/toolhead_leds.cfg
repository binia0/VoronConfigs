# ============================================================
# STEALTHCHANGER - TOOLHEAD LED STATUS
# T0 - T5 / LDO Nitehawk-36 / NeoPixel GRBW
#
# Nur das aktive Tool zeigt die Statusfarbe.
# Alle anderen Tools bleiben tuerkis.
# ============================================================

[gcode_macro TOOLHEAD_LED_STATUS]
description: Set LED status for active StealthChanger tool only
gcode:
    {% set status = params.STATUS|default("IDLE")|upper %}
    {% set active_tool = printer.toolchanger.tool_number|int %}

    # --------------------------------------------------------
    # Statusfarben
    # --------------------------------------------------------

    {% if status == "IDLE" %}
        {% set r, g, b, w = 0.0, 1.0, 0.72, 0.0 %}
    {% elif status == "HOMING" %}
        {% set r, g, b, w = 0.0, 0.2, 1.0, 0.0 %}
    {% elif status == "QGL" %}
        {% set r, g, b, w = 0.65, 0.0, 1.0, 0.0 %}
    {% elif status == "MESH" %}
        {% set r, g, b, w = 0.0, 0.8, 1.0, 0.0 %}
    {% elif status == "HEATING" %}
        {% set r, g, b, w = 1.0, 0.35, 0.0, 0.0 %}
    {% elif status == "PRIME" %}
        {% set r, g, b, w = 1.0, 1.0, 0.0, 0.0 %}
    {% elif status == "PRINTING" %}
        {% set r, g, b, w = 0.0, 0.0, 0.0, 1.0 %}
    {% elif status == "TOOLCHANGE" %}
        {% set r, g, b, w = 1.0, 0.15, 0.0, 0.0 %}
    {% elif status == "ERROR" %}
        {% set r, g, b, w = 1.0, 0.0, 0.0, 0.0 %}
    {% elif status == "DONE" %}
        {% set r, g, b, w = 0.0, 1.0, 0.0, 0.0 %}
    {% elif status == "OFF" %}
        {% set r, g, b, w = 0.0, 0.0, 0.0, 0.0 %}
    {% else %}
        {action_raise_error("Unknown toolhead LED status: " ~ status)}
    {% endif %}

    # --------------------------------------------------------
    # LED-Steuerung T0 bis T5
    # --------------------------------------------------------

    {% for tn in range(6) %}

        {% if tn == active_tool %}

            # Aktives Tool: Statusfarbe
            SET_LED LED=T{tn}_Neopixel RED={r} GREEN={g} BLUE={b} WHITE={w} SYNC=0 TRANSMIT=1

        {% else %}

            # Geparkte Tools: Tuerkis
            SET_LED LED=T{tn}_Neopixel RED=0 GREEN=1 BLUE=0.72 WHITE=0 SYNC=0 TRANSMIT=1

        {% endif %}

    {% endfor %}


# ============================================================
# STATUS MAKROS
# ============================================================

[gcode_macro TOOLHEAD_LED_IDLE]
description: Set toolhead LEDs to idle turquoise
gcode:
    TOOLHEAD_LED_STATUS STATUS=IDLE


[gcode_macro TOOLHEAD_LED_HOMING]
description: Active tool blue during homing
gcode:
    TOOLHEAD_LED_STATUS STATUS=HOMING


[gcode_macro TOOLHEAD_LED_QGL]
description: Active tool purple during QGL
gcode:
    TOOLHEAD_LED_STATUS STATUS=QGL


[gcode_macro TOOLHEAD_LED_MESH]
description: Active tool cyan during bed mesh
gcode:
    TOOLHEAD_LED_STATUS STATUS=MESH


[gcode_macro TOOLHEAD_LED_HEATING]
description: Active tool orange during heating
gcode:
    TOOLHEAD_LED_STATUS STATUS=HEATING


[gcode_macro TOOLHEAD_LED_PRIME]
description: Active tool yellow during priming
gcode:
    TOOLHEAD_LED_STATUS STATUS=PRIME


[gcode_macro TOOLHEAD_LED_PRINTING]
description: Active tool white during printing
gcode:
    TOOLHEAD_LED_STATUS STATUS=PRINTING


[gcode_macro TOOLHEAD_LED_TOOLCHANGE]
description: Active tool orange-red during toolchange
gcode:
    TOOLHEAD_LED_STATUS STATUS=TOOLCHANGE


[gcode_macro TOOLHEAD_LED_ERROR]
description: Active tool red on error
gcode:
    TOOLHEAD_LED_STATUS STATUS=ERROR


[gcode_macro TOOLHEAD_LED_DONE]
description: Active tool green when print is finished
gcode:
    TOOLHEAD_LED_STATUS STATUS=DONE