[gcode_macro _SPOOLMAN_SET_FIELD_filament_id]
description: Store active Spoolman filament ID
gcode:
  {% if params.VALUE is defined %}
    {% set id = params.VALUE|int %}
    SAVE_VARIABLE VARIABLE=active_filament_id VALUE={id}
  {% endif %}

[gcode_macro _SPOOLMAN_CLEAR_SPOOL]
description: Clear active filament information
gcode:
  SAVE_VARIABLE VARIABLE=active_filament_id VALUE=None

[gcode_macro _SPOOLMAN_CLEAR_FIELDS]
description: Clear previously received filament information
gcode:
  SAVE_VARIABLE VARIABLE=active_filament_id VALUE=None

[gcode_macro _SPOOLMAN_DONE]
description: Spoolman data received
gcode:
  RESPOND MSG="Spool2Klipper: Filamentinformationen aktualisiert"

# Save GUI-selected spool to the currently active StealthChanger tool
[gcode_macro _SPOOLMAN_SET_FIELD_id]
description: Persist Spoolman GUI selection for active tool
gcode:
  {% set id = params.VALUE|default(0)|int %}
  {% set t = printer.toolchanger.tool_number|int %}
  {% if printer.toolchanger.status == "ready" and 0 <= t <= 5 and id > 0 %}
    SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={id}
    SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE={id}
    RESPOND MSG="Spoolman: T{t} spool {id} saved"
  {% endif %}
