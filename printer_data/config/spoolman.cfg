[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}


# Spoolman: separate spool assignment per StealthChanger tool
[gcode_macro SET_TOOL_SPOOL]
description: Assign a Spoolman spool to a tool (TOOL=0..5 ID=...)
gcode:
  {% set t = params.TOOL|default(-1)|int %}
  {% set id = params.ID|default(0)|int %}
  {% if t < 0 or t > 5 or id <= 0 %}
    {action_raise_error("Use SET_TOOL_SPOOL TOOL=0..5 ID=<positive spool ID>")}
  {% else %}
    SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={id}
    SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE={id}
    RESPOND MSG="T{t}: Spoolman spool {id} assigned"
  {% endif %}

[gcode_macro _SYNC_TOOL_SPOOL]
description: Activate assigned spool for selected tool
gcode:
  {% set t = params.TOOL|int %}
  {% if t >= 0 and t <= 5 %}
    {% set id = printer["gcode_macro T" ~ t].spool_id %}
    {% if id is not none and id|int > 0 %}
      SET_ACTIVE_SPOOL ID={id|int}
    {% else %}
      CLEAR_ACTIVE_SPOOL
    {% endif %}
  {% endif %}

[gcode_macro CLEAR_TOOL_SPOOL]
description: Remove spool assignment (TOOL=0..5)
gcode:
  {% set t = params.TOOL|default(-1)|int %}
  {% if t < 0 or t > 5 %}
    {action_raise_error("Use CLEAR_TOOL_SPOOL TOOL=0..5")}
  {% else %}
    SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE=None
    SAVE_VARIABLE VARIABLE=t{t}__spool_id VALUE=None
    RESPOND MSG="T{t}: spool assignment cleared"
  {% endif %}

[delayed_gcode RESTORE_TOOL_SPOOLS]
initial_duration: 5
gcode:
  {% set saved = printer.save_variables.variables %}
  {% for t in range(6) %}
    {% set id = saved["t" ~ t ~ "__spool_id"]|default(None) %}
    {% if id is not none %}
      SET_GCODE_VARIABLE MACRO=T{t} VARIABLE=spool_id VALUE={id}
    {% endif %}
  {% endfor %}
  UPDATE_DELAYED_GCODE ID=SYNC_STARTUP_SPOOL DURATION=2

[delayed_gcode SYNC_STARTUP_SPOOL]
initial_duration: 0
gcode:
  {% if printer.toolchanger.status == "ready" %}
    {% set t = printer.toolchanger.tool_number|int %}
    {% if t >= 0 and t <= 5 %}
      _SYNC_TOOL_SPOOL TOOL={t}
    {% else %}
      CLEAR_ACTIVE_SPOOL
    {% endif %}
  {% else %}
    CLEAR_ACTIVE_SPOOL
  {% endif %}



