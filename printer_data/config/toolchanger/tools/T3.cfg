# This file contains pin mappings for the LDO Nitehawk-36 Toolboard
# To use this config, the firmware should be compiled for the Raspberry Pi RP2040
# Make sure to include this config *at the end* of printer.cfg to overwrite the relevent sections

# See https://docs.ldomotors.com/en/Toolboard/nitehawk-36#firmware-setup-and-update
# For instructions on uploading/updating klipper firmware to the PCB

## LDO Nitehawk-SB Toolboard Partial Config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] sections

## *MAKE SURE* to include this partial config file *AFTER* the main controller config. 
## This will ensure the relavent sections are overwritten by the pin mappings specified here.

[mcu T3]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify 

##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_32323232361966A5-if00 

restart_method: command

#####################################################################
#   Accelerometer
#####################################################################
# change the accelerometer section name to the tool you are configuring:
# T3, T3, etc.
[adxl345 T3]
cs_pin: T3:gpio27
spi_software_sclk_pin: T3:gpio18
spi_software_mosi_pin: T3:gpio20
spi_software_miso_pin: T3:gpio19
axes_map: x,z,y

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
##--------------------------------------------------------------------
## Uncomment below for 250mm build
#probe_points:
#    125, 125, 20

## Uncomment below for 300mm build
#probe_points:
#    155, 155, 20

## Uncomment below for 350mm build
probe_points:
    175, 175, 20

#####################################################################
# 	Extruder
#####################################################################
[extruder3]
#max_extrude_only_distance: 150
step_pin: T3:gpio23
dir_pin: !T3:gpio24
enable_pin: !T3:gpio25
heater_pin: T3:gpio9
sensor_pin: T3:gpio29
control: pid  
pid_Kp: 28.970
pid_Ki: 3.576
pid_Kd: 58.666
nozzle_diameter: 0.400
filament_diameter: 1.75
pullup_resistor: 2200
rotation_distance: 47.088		#calibrate that shit
min_temp: 0
max_temp: 290
gear_ratio: 9:1
microsteps: 16
#sensor_type: Generic 3950
sensor_type: ATC Semitec 104NT-4-R025H42G


[tmc2209 extruder3]
sense_resistor: 0.100
uart_pin: T3:gpio0
tx_pin: T3:gpio1
interpolate: false
run_current: 0.85
hold_current: 0.5
stealthchop_threshold: 0


#####################################################################
# 	Probe
#####################################################################
#change the tool numbers to the tool you are configuring, ie T3, T3, etc
[tool T3]
#change this too
tool_number: 3
#if this were T3, then this would be extruder1, etc
extruder: extruder3
#Change T3_partfan to tool number
fan: T3_part_fan

#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 14
params_park_y: 6.8
params_park_z: 297
gcode_x_offset: 0 # The X-Axis offset of the nozzle's orifice in relation to tool 0
gcode_y_offset: 0 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: 0 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# For InputShaper run per tool and enter the frequency here
#params_input_shaper_type_x: 'mzv'
#params_input_shaper_freq_x: 52
#params_input_shaper_type_y: 'mzv'
#params_input_shaper_freq_y: 37.2


[tool_probe T3]
pin: T3:gpio10
tool: 3
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
# More positive = More Squish
z_offset = 0.6
#z_offset = -1.170 # TEXTURED PLATE
#z_offset = -1.290 #-1.390 # SMOOTH PLATE
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode: _TAP_PROBE_ACTIVATE HEATER=extruder2

#####################################################################
#   Fans
#####################################################################
## PCF
#Set up for [fan generic]
[fan_generic T3_part_fan]
pin: T3:gpio6
kick_start_time: 0.5


## HEF
[heater_fan T3_hotend_fan]
pin: T3:gpio5
tachometer_pin: T3:gpio16
tachometer_ppr: 2
kick_start_time: 0.5
heater_temp: 50.0
heater: extruder3

#####################################################################
#   Lights
#####################################################################
##Stealthburner Headlights
[neopixel T3_Neopixel]
pin: T3:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0
initial_GREEN: 1
initial_BLUE: 0
initial_WHITE: 0.0

## PCB Activity Light
[output_pin act_led]
pin: !T3:gpio8

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor T3]
sensor_type: temperature_mcu
sensor_mcu: T3
min_temp: 0
max_temp: 100

[filament_switch_sensor T3_entry]
switch_pin: T3:gpio13
pause_on_runout: True

insert_gcode:
  M117 Insert Detected
  SET_LED LED=T3_Neopixel RED=0 GREEN=1 BLUE=0 WHITE=0

runout_gcode:
  M117 Runout Detected
  SET_LED LED=T3_Neopixel RED=1 GREEN=0 BLUE=0 WHITE=0

[filament_switch_sensor T3_runout]
switch_pin: T3:gpio3
pause_on_runout: True

insert_gcode:
  M117 Insert Detected
  SET_LED LED=T3_Neopixel RED=0 GREEN=1 BLUE=0 WHITE=0

runout_gcode:
  M117 Runout Detected
  SET_LED LED=T3_Neopixel RED=1 GREEN=0 BLUE=0 WHITE=0

#####################################################################
#   Macro for T3
#####################################################################
[gcode_macro T3]
variable_active: 0 # Must be zero.
variable_color: "" # Leave empty
variable_spool_id: None
gcode:
  SELECT_TOOL T=3
  _SYNC_TOOL_SPOOL TOOL=3

