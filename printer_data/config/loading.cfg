[gcode_macro FILAMENT_DATA]
variable_load_length: 35        # bis kurz vor Düse
variable_prime_length: 15       # bis Filament sauber austritt
variable_unload_length: 80      # komplett raus aus Extruder
variable_purge_length: 10       # optional kleiner Spülstoß
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}


[gcode_macro LOAD_FILAMENT]
description: Sauberes Filament Laden
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    M117 Filament Load...

    # Temperatur prüfen
    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}
    {% endif %}

    G91

    # Langsam greifen
    G1 E10 F300

    # Hauptförderung bis vor Düse
    G1 E{printer["gcode_macro FILAMENT_DATA"].load_length} F600

    # Langsam in Schmelzzone
    G1 E{printer["gcode_macro FILAMENT_DATA"].prime_length} F300

    # kurzer Druckaufbau
    G1 E{printer["gcode_macro FILAMENT_DATA"].purge_length} F200

    G90

    M117 Filament geladen


[gcode_macro UNLOAD_FILAMENT]
description: Sauberes Filament Entladen
gcode:
    {% set TEMP = params.TEMP|default(220)|int %}

    M117 Filament Unload...

    # Temperatur prüfen
    {% if printer.extruder.temperature < TEMP %}
        M109 S{TEMP}
    {% endif %}

    G91

    # kleinen Druckstoß vor Entladen
    G1 E5 F200

    # schneller Retract aus Schmelzzone
    G1 E-15 F1800

    # langsamer langer Retract komplett raus
    G1 E-{printer["gcode_macro FILAMENT_DATA"].unload_length} F900

    G90

    M117 Filament entladen
